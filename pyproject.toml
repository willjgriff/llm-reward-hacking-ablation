[project]
name = "rhablation"
version = "0.1.0"
description = "Orthogonalization against reward hacking: benchmark harness and trajectory tooling"
# impossiblebench uses Python 3.12-only f-string syntax
requires-python = ">=3.12,<3.13"
dependencies = [
    "inspect-ai>=0.3.263",
    "impossiblebench @ git+https://github.com/safety-research/impossiblebench",
    "openai>=1.0",
    "httpx>=0.27",
    "transformers>=4.57",
    "huggingface-hub>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.5.3",
    "scikit-learn>=1.9.1",
    "safetensors>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhablation"]

[tool.hatch.metadata]
allow-direct-references = true
